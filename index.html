<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Portal Mitra Samira</title>

  <link rel="icon"
    href="https://drive.google.com/uc?export=view&id=1S0IoME4KWLgjIwghlhzX36SzTES4FsCw">

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#f4f7f5;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .card{
      width:100%;
      max-width:430px;
      background:white;
      border-radius:22px;
      padding:30px 25px;
      text-align:center;
      box-shadow:0 8px 30px rgba(0,0,0,.12);
    }

    .logo{
      width:130px;
      height:130px;
      object-fit:cover;
      border-radius:22px;
      margin-bottom:15px;
    }

    h1{
      color:#0b6b3a;
      font-size:25px;
      margin:8px 0;
    }

    .subtitle{
      color:#666;
      font-size:15px;
      margin-bottom:25px;
    }

    .button{
      display:block;
      width:100%;
      padding:16px;
      margin:12px 0;
      border-radius:12px;
      text-decoration:none;
      color:white;
      font-size:17px;
      font-weight:bold;
    }

    .portal{
      background:#0b6b3a;
    }

    .passport{
      background:#1565C0;
    }

    .cuti{
      background:#00897B;
    }

    .mitra{
      background:#6A1B9A;
    }

    .registrasi{
      background:#1976D2;
    }

    .footer{
      margin-top:25px;
      font-size:12px;
      color:#888;
    }
  </style>
</head>

<body>

<div class="card">

  <img
    class="logo"
    src="https://drive.google.com/uc?export=view&id=1S0IoME4KWLgjIwghlhzX36SzTES4FsCw"
    alt="Logo Samira">

  <h1>🕌 SAMIRA TRAVEL</h1>

  <div class="subtitle">
    Portal Layanan Mitra
  </div>

  <a
    class="button portal"
    href="https://bit.ly/PortalMitraSamira"
    target="_blank">
    📲 BUKA PORTAL MITRA
  </a>

  <a
    class="button passport"
    href="https://forms.gle/rEamrqTboHKzGDFc6"
    target="_blank">
    🛂 PERMINTAAN SURAT REKOMENDASI PASSPORT
  </a>

  <a
    class="button cuti"
    href="https://forms.gle/iiSAdMn83uf7jffJ9"
    target="_blank">
    🕌 PENGAJUAN CUTI JAMAAH
  </a>

  <a
    class="button mitra"
    href="https://agen.samiratravel.co.id/home"
    target="_blank">
    🤝 PENDAFTARAN MITRA BARU
  </a>

  <a
    class="button registrasi"
    href="https://docs.google.com/forms/d/e/1FAIpQLSe7O9ko2x4y_RrPdjrgpJCc71Osbcg11QP-e-v-DMjq4MCkeQ/viewform"
    target="_blank">
    ➕ REGISTRASI JAMAAH BARU
  </a>

  <div class="footer">
    Semoga Allah SWT memudahkan seluruh proses ibadah Umrah. Aamiin.
  </div>

</div>

</body>
</html>
